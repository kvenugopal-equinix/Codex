name: WarRoomBot macOS build

on:
  push:
    branches: [codex/warroombot-fixed-20261012]
    paths: [WarRoomBot/**, .github/workflows/warroombot-macos.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: WarRoomBot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies from the explicit CI index
        run: python -m pip install --index-url https://pypi.org/simple/ --require-hashes -r requirements-dev.txt
      - name: Verify runtime with fake Zoom and audio
        run: python -m pytest -q
      - name: Compile, sign, smoke-test and verify universal app and DMG
        run: bash tools/build_app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WarRoomBot-macOS
          path: WarRoomBot/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
