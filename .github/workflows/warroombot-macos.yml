name: WarRoomBot macOS build

on:
  push:
    branches: [codex/warroombot-fixed-20261012]
    paths: [WarRoomBot/**, .github/workflows/warroombot-macos.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: WarRoomBot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies from the explicit CI index
        run: python -m pip install --index-url https://pypi.org/simple/ --require-hashes -r requirements-dev.txt
      - name: Verify runtime with fake Zoom and audio
        run: python -m pytest -q
      - name: Compile, sign, exercise native window and verify universal app and DMG
        env:
          WARROOM_BUILD_ARCHS: universal
        run: bash tools/build_app.sh
      - name: Verify the copy installed from the DMG
        run: |
          WRB_INSTALLED_APP='/Applications/War Room Bot.app'
          test ! -e "$WRB_INSTALLED_APP"
          WRB_INSTALL_MOUNT=$(mktemp -d)
          WRB_CREATED_APP=0
          cleanup() {
            hdiutil detach "$WRB_INSTALL_MOUNT" >/dev/null 2>&1 || true
            if [ "$WRB_CREATED_APP" = 1 ]; then rm -rf "$WRB_INSTALLED_APP"; fi
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$WRB_INSTALL_MOUNT" "dist/War-Room-Bot-$(cat VERSION).dmg" >/dev/null
          WRB_CREATED_APP=1
          ditto "$WRB_INSTALL_MOUNT/War Room Bot.app" "$WRB_INSTALLED_APP"
          python3 tools/diagnose_app_launch.py --app "$WRB_INSTALLED_APP" --dmg "$PWD/dist/War-Room-Bot-$(cat VERSION).dmg"
          python3 tools/check_app_ui.py "$WRB_INSTALLED_APP"
          python3 tools/repair_installed_app.py --app "$WRB_INSTALLED_APP"
          python3 tools/check_app_ui.py "$WRB_INSTALLED_APP"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import runpy
          import subprocess
          import sys

          repair = runpy.run_path('tools/repair_installed_app.py')
          app = Path('/Applications/War Room Bot.app')
          original_inode = app.stat().st_ino
          original_content = repair['inventory'](app)
          attribute = 'com.warroombot.repair-fixture'
          subprocess.run(['/usr/bin/xattr', '-w', attribute, 'original app metadata', str(app)], check=True)
          receipt = repair['repair'](app, prepare_for_finder=True, reveal=False)
          prepared = json.loads(receipt.read_text())
          candidate, backup = Path(prepared['candidate']), Path(prepared['backup'])
          assert app.stat().st_ino == original_inode
          assert repair['inventory'](app) == original_content
          assert repair['inventory'](backup) == original_content
          assert subprocess.check_output(['/usr/bin/xattr', '-p', attribute, str(backup)]).strip() == b'original app metadata'
          assert attribute not in subprocess.check_output(['/usr/bin/xattr', str(candidate)], text=True).splitlines()
          assert (candidate.parent / 'Applications').resolve() == app.parent

          # Simulate Finder's copy into the CI-owned Applications path. No user
          # apps are present: this exact app was created by this workflow step.
          previous = receipt.parent / 'ci-previous-install'
          app.rename(previous)
          subprocess.run(['/usr/bin/ditto', str(candidate), str(app)], check=True)
          subprocess.run([sys.executable, 'tools/repair_installed_app.py',
                          '--verify-installed', str(receipt)], check=True)
          assert app.stat().st_ino != original_inode
          print('Finder staging and installed verification passed; original backup retained.')
          PY
          python3 tools/check_app_ui.py "$WRB_INSTALLED_APP"
      - name: Verify Finder update from the previous release
        run: |
          WRB_INSTALLED_APP='/Applications/War Room Bot.app'
          test ! -e "$WRB_INSTALLED_APP"
          WRB_UPDATE_MOUNT=$(mktemp -d)
          WRB_CREATED_APP=0
          cleanup() {
            hdiutil detach "$WRB_UPDATE_MOUNT" >/dev/null 2>&1 || true
            if [ "$WRB_CREATED_APP" = 1 ]; then rm -rf "$WRB_INSTALLED_APP"; fi
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$WRB_UPDATE_MOUNT" '../releases/War-Room-Bot-20261013.1.dmg' >/dev/null
          WRB_CREATED_APP=1
          ditto "$WRB_UPDATE_MOUNT/War Room Bot.app" "$WRB_INSTALLED_APP"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import runpy
          import subprocess
          import sys

          update = runpy.run_path('tools/prepare_app_update.py')
          repair = runpy.run_path('tools/repair_installed_app.py')
          app = Path('/Applications/War Room Bot.app')
          version = Path('VERSION').read_text().strip()
          archive = Path('dist') / ('War-Room-Bot-' + version + '-app.zip')
          original_inode = app.stat().st_ino
          original_content = repair['inventory'](app)
          assert repair['identity'](app)['version'] == '20261013.1'
          receipt = update['prepare'](app, hashlib.sha256(archive.read_bytes()).hexdigest(),
                                      archive=archive, reveal=False)
          prepared = json.loads(receipt.read_text())
          candidate, backup = Path(prepared['candidate']), Path(prepared['backup'])
          assert app.stat().st_ino == original_inode
          assert repair['inventory'](app) == original_content
          assert repair['inventory'](backup) == original_content
          assert repair['identity'](backup)['version'] == '20261013.1'
          assert repair['identity'](candidate)['version'] == version
          assert (candidate.parent / 'Applications').resolve() == app.parent

          # Only this workflow's freshly created installation is replaced.
          app.rename(receipt.parent / 'ci-previous-release-install')
          subprocess.run(['/usr/bin/ditto', str(candidate), str(app)], check=True)
          subprocess.run([sys.executable, 'tools/repair_installed_app.py',
                          '--verify-installed', str(receipt)], check=True)
          assert repair['identity'](app)['version'] == version
          print('Published version 20261013.1 updated through verified Finder staging; original backup retained.')
          PY
          python3 tools/check_app_ui.py "$WRB_INSTALLED_APP"
      - name: Verify local rebuild from the installed payload
        run: |
          WRB_VERIFY_MOUNT=$(mktemp -d)
          trap 'hdiutil detach "$WRB_VERIFY_MOUNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$WRB_VERIFY_MOUNT" "dist/War-Room-Bot-$(cat VERSION).dmg" >/dev/null
          bash tools/rebuild_installed_app.sh --no-open --app "$WRB_VERIFY_MOUNT/War Room Bot.app"
          WRB_LEGACY_BUILDER=$(mktemp)
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/kvenugopal-equinix/Codex/9ee8d8df67bbdb95032729acb0c4b8ad3e90dedb/WarRoomBot/tools/build_app.sh' --output "$WRB_LEGACY_BUILDER"
          python3 tools/check_local_rebuild.py "$WRB_VERIFY_MOUNT/War Room Bot.app" "$WRB_LEGACY_BUILDER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WarRoomBot-macOS
          path: |
            WarRoomBot/dist/*.dmg
            WarRoomBot/dist/*-app.zip
          if-no-files-found: error
          retention-days: 14
